repos:
-   repo: https://github.com/realm/SwiftLint
    rev: 0.54.0  # Use the latest SwiftLint version
    hooks:
    -   id: swiftlint
        name: SwiftLint
        description: "Check Swift code for style and conventions"
        # Optional: Add --fix to automatically correct simple violations
        args: [--fix, --strict]
